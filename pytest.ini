[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: fast deterministic tests that do not require service startup, private datasets, or heavyweight ML/runtime dependencies
    integration: tests that require a running service or external runtime dependency
    runtime: runtime dependency and application startup checks, including FFmpeg, OpenCV, model loading, and HTTP health/readiness behavior
    ml: machine-learning preprocessing, training, model governance, artifact compatibility, and inference contract tests
    dataset_validation: dataset source, fingerprint, split, leakage, and cross-modality validation tests
    slow: expensive validation tests retained outside the default PR fast path
    e2e: end-to-end application workflow or browser/manual acceptance tests
    manual: manual QA checks not intended for routine automated collection
